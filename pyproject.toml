[project]
name = "llmbench-gfx1151"
version = "0.1.0"
description = "A study of llama.cpp ROCm vs Vulkan throughput on an AMD Ryzen AI MAX+ 395 (gfx1151) iGPU"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.23.16",
    "matplotlib>=3.11.1",
    "numpy>=2.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
site = [
    "markdown>=3.7",
    # `marimo export ipynb` needs this to write the executed notebook the site
    # renderer reads; marimo does not depend on it itself.
    "nbformat>=5.10",
]

[tool.uv]
# This is an analysis repo, not a distributable library: nothing imports it from
# outside the working tree, so there is no wheel to build and no build backend.
package = false

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Em dashes and middle dots are deliberate in prose and in plot labels.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell displays the value of its last expression, so a bare trailing
# name is the output of the cell rather than dead code.
"analysis.py" = ["B018"]
# The tests exercise parsing helpers directly, including private ones.
"test_llmbench.py" = ["SLF001"]
